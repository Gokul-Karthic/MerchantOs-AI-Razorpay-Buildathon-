name: merchantos-ai

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: merchantos-ai:1.4.1
    env_file:
      - .env
    environment:
      MERCHANTOS_DB_PATH: /data/merchantos.db
      MERCHANTOS_ARTIFACT_DIR: /data/artifacts
      MERCHANTOS_DASHBOARD_PUBLIC_URL: http://localhost:8501
    volumes:
      - ./runtime:/data
    ports:
      - "8000:8000"
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped
    init: true

  dashboard:
    image: merchantos-ai:1.4.1
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      MERCHANTOS_API_BASE_URL: http://api:8000/api
      MERCHANTOS_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "8501:8501"
    command:
      - python
      - -m
      - streamlit
      - run
      - app/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped
    init: true
